<!doctype html><meta charset="utf-8"><title>MSE lifecycle and bounds</title>
<style>body{font:18px sans-serif;background:#10202b;color:#dcefff;padding:24px}video{width:320px;height:240px}pre{white-space:pre-wrap}</style>
<h1>MSE lifecycle and bounds</h1><video id="video" muted playsinline></video><pre id="results"></pre>
<script>
const video=document.querySelector('#video'),results=document.querySelector('#results');let checks=0,source,buffer,url;
const wait=milliseconds=>new Promise(resolve=>setTimeout(resolve,milliseconds));
function check(condition,name){if(!condition)throw Error(name);++checks;results.textContent+=name+'\n';console.log('MSE LIMIT CHECK '+name)}
function event(target,name,action){return new Promise((resolve,reject)=>{const timer=setTimeout(()=>{cleanup();reject(Error('timeout '+name))},15000);function cleanup(){clearTimeout(timer);target.removeEventListener(name,success);target.removeEventListener('error',failure)}function success(){cleanup();resolve()}function failure(){cleanup();reject(Error('unexpected media error '+video.error?.code+' '+video.error?.message))}target.addEventListener(name,success);if(name!=='error')target.addEventListener('error',failure);action?.()})}
async function until(predicate){for(let index=0;index<300;++index){if(predicate())return;await wait(50)}throw Error('condition timeout')}
function dominant(index){const canvas=document.createElement('canvas');canvas.width=160;canvas.height=120;const context=canvas.getContext('2d');context.drawImage(video,0,0,160,120);const pixel=context.getImageData(80,60,1,1).data;return pixel[index]>180&&pixel[(index+1)%3]<60&&pixel[(index+2)%3]<60}
async function append(bytes){await event(buffer,'updateend',()=>buffer.appendBuffer(bytes))}
async function attach(){video.removeAttribute('src');video.load();if(url)URL.revokeObjectURL(url);source=new MediaSource();url=URL.createObjectURL(source);await event(source,'sourceopen',()=>{video.src=url});buffer=source.addSourceBuffer('video/webm; codecs="vp8"')}
(async()=>{try{
 const vp8=await (await fetch('/media-vp8.webm')).arrayBuffer(),vp9=await (await fetch('/media-vp9.webm')).arrayBuffer();
 await attach();await append(vp8.slice(0,73));buffer.abort();check(!buffer.updating,'abort resets partial parser');
 await append(vp8);await until(()=>video.readyState>=2);check(dominant(0),'append after partial abort');
 await attach();buffer.appendWindowStart=1;buffer.appendWindowEnd=2;await append(vp8);source.endOfStream();await until(()=>video.readyState>=1);
 check(buffer.buffered.start(0)>=1&&buffer.buffered.end(0)<=2.01,'append window filters frames');
 await event(video,'seeked',()=>video.currentTime=1.3);check(dominant(1),'append window pixels');
 await attach();buffer.mode='sequence';await append(vp8);await append(vp8);await until(()=>video.readyState>=2);
 check(buffer.buffered.end(0)>5.9,'sequence appends contiguous clips');
 buffer.changeType('video/webm; codecs="vp9"');await append(vp9);source.endOfStream();
 await event(video,'seeked',()=>video.currentTime=7.3);check(dominant(1),'changeType reconfigures VP9 decoder');
 await event(video,'seeked',()=>video.currentTime=video.duration);check(!video.seeking&&dominant(2),'seek exact duration keeps final frame');
 await attach();await event(video,'error',()=>buffer.appendBuffer(new Uint8Array([1,2,3,4,5,6,7,8])));check(video.error!==null,'malformed source signals media error');
 await attach();const longClip=await (await fetch('/media-quota.webm')).arrayBuffer();await append(longClip);source.endOfStream();await until(()=>video.readyState>=2);
 await event(video,'ended',()=>video.play());check(video.ended&&video.getVideoPlaybackQuality().totalVideoFrames>=70,'bounded frame queue plays over 64 MiB cumulatively');
 await event(video,'seeked',()=>video.currentTime=.3);check(dominant(0),'seek redecodes evicted frames');
 await attach();await append(vp8);await until(()=>video.readyState>=2);source.duration=20;video.currentTime=19;await wait(100);check(video.seeking,'pending seek before detach');
 await attach();await append(vp8);source.endOfStream();await until(()=>video.readyState>=2);check(dominant(0),'detach invalidates pending callbacks');
 source.removeSourceBuffer(buffer);check(source.sourceBuffers.length===0,'remove active source buffer');
 await attach();await append(vp8);source.endOfStream();await until(()=>video.readyState>=2);check(dominant(0),'recover after source buffer removal');
 document.querySelector('h1').textContent='MSE bounds: '+checks+' checks passed';console.log('MSE LIMIT PASS checks='+checks);
}catch(error){console.error('MSE LIMIT FAILURE '+error.stack);results.textContent+='FAIL '+error.stack}})();
</script>
