<!doctype html><meta charset="utf-8"><title>MSE audio and video</title>
<style>body{font:18px sans-serif;background:#10202b;color:#dcefff;padding:24px}video{width:320px;height:240px;background:#222}button{position:absolute;left:380px;top:180px;padding:16px;margin:10px}pre{white-space:pre-wrap}</style>
<h1>MSE audio and video</h1><video id="video" playsinline></video><br><button id="run" disabled>Run audio/video checks</button><pre id="results"></pre>
<script>
const video=document.querySelector('#video'),results=document.querySelector('#results');let source,url,checks=0;
const wait=milliseconds=>new Promise(resolve=>setTimeout(resolve,milliseconds));
function check(condition,name){if(!condition)throw Error(name);++checks;results.textContent+=name+'\n';console.log('MSE AUDIO CHECK '+name)}
function event(target,name,action){return new Promise((resolve,reject)=>{const timer=setTimeout(()=>{cleanup();reject(Error('timeout '+name))},15000);function cleanup(){clearTimeout(timer);target.removeEventListener(name,success);video.removeEventListener('error',failure)}function success(){cleanup();resolve()}function failure(){cleanup();reject(Error('media '+video.error?.code+' '+video.error?.message))}target.addEventListener(name,success);video.addEventListener('error',failure);action?.()})}
async function until(predicate){for(let index=0;index<300;++index){if(predicate())return;await wait(50)}throw Error('condition timeout '+video.currentTime)}
function dominant(index){const canvas=document.createElement('canvas');canvas.width=160;canvas.height=120;const context=canvas.getContext('2d');context.drawImage(video,0,0,160,120);const pixel=context.getImageData(80,60,1,1).data;return pixel[index]>180&&pixel[(index+1)%3]<60&&pixel[(index+2)%3]<60}
async function append(buffer,bytes){await event(buffer,'updateend',()=>buffer.appendBuffer(bytes))}
async function attach(){video.removeAttribute('src');video.load();if(url)URL.revokeObjectURL(url);source=new MediaSource();url=URL.createObjectURL(source);await event(source,'sourceopen',()=>video.src=url)}
function failure(error){console.error('MSE AUDIO FAILURE '+error.stack);results.textContent+='FAIL '+error.stack}
(async()=>{try{
 check(MediaSource.isTypeSupported('audio/webm; codecs="opus"'),'Opus MSE capability');
 check(MediaSource.isTypeSupported('video/webm; codecs="vp09.00.51.08,opus"'),'standard eight-bit VP9 codec string');
 check(!MediaSource.isTypeSupported('video/webm; codecs="vp09.02.51.10"'),'ten-bit VP9 is not advertised');
 check(!MediaSource.isTypeSupported('video/webm; codecs="vp09.99.51.08"'),'invalid VP9 profile is rejected');
 await attach();const buffer=source.addSourceBuffer('video/webm; codecs="vp8,opus"');const bytes=await (await fetch('/media-mse-av.webm')).arrayBuffer();
 for(let offset=0;offset<bytes.byteLength;offset+=4096)await append(buffer,bytes.slice(offset,offset+4096));source.endOfStream();await until(()=>video.readyState>=2);
 check(dominant(0)&&video.videoWidth===160,'muxed VP8 and Opus initial frame');document.querySelector('#run').disabled=false;console.log('MSE AUDIO READY');
}catch(error){failure(error)}})();
document.querySelector('#run').onclick=async()=>{document.querySelector('#run').disabled=true;try{
 await video.play();await until(()=>video.currentTime>2.3);video.pause();check(dominant(1),'audio clock presents green video');console.log('MSE AUDIO GREEN');const paused=video.currentTime;await wait(1800);check(Math.abs(video.currentTime-paused)<.03,'stream pause retains position');
 await video.play();await until(()=>video.currentTime>4.3);video.pause();check(dominant(2),'DMA ring wraps and reaches blue');console.log('MSE AUDIO BLUE');await wait(1800);
 await event(video,'seeked',()=>video.currentTime=4.1);await video.play();await wait(600);video.muted=true;await wait(500);video.muted=false;video.volume=.25;await wait(500);video.pause();check(video.currentTime>5.4,'seek and gain controls preserve clock');video.volume=1;
 await event(video,'seeked',()=>video.currentTime=5.8);await event(video,'ended',()=>video.play());check(video.ended,'audio/video end together');
 await event(video,'seeked',()=>video.currentTime=.3);check(dominant(0),'seek resets Opus and video');
 await attach();const videoBuffer=source.addSourceBuffer('video/webm; codecs="vp8"'),audioBuffer=source.addSourceBuffer('audio/webm; codecs="opus"');
 await append(videoBuffer,await (await fetch('/media-mse-video.webm')).arrayBuffer());await append(audioBuffer,await (await fetch('/media-opus.webm')).arrayBuffer());source.duration=12;await until(()=>video.readyState>=2);
 check(dominant(0),'separate audio and video source buffers');await video.play();await until(()=>video.currentTime>2.2);video.pause();check(dominant(1),'separate streams use audio clock');
 await video.play();await until(()=>video.currentTime>=5.99);await wait(350);check(video.currentTime<6.1&&!video.ended,'audio underflow freezes shared clock');
 videoBuffer.timestampOffset=6;audioBuffer.timestampOffset=6;
 await append(videoBuffer,await (await fetch('/media-mse-video.webm')).arrayBuffer());await append(audioBuffer,await (await fetch('/media-opus.webm')).arrayBuffer());source.endOfStream();
 await until(()=>video.currentTime>6.3);video.pause();check(dominant(0),'new audio/video segments resume DMA');
 await attach();const onlyAudio=source.addSourceBuffer('audio/webm; codecs="opus"');await append(onlyAudio,await (await fetch('/media-opus.webm')).arrayBuffer());source.endOfStream();await until(()=>video.readyState>=2);
 await video.play();await until(()=>video.currentTime>.3);video.pause();check(video.videoWidth===0,'audio-only MSE playback');
 await event(video,'seeked',()=>video.currentTime=4.3);await video.play();await wait(500);video.pause();check(video.currentTime>4.6,'audio-only seek and resume');
 document.querySelector('h1').textContent='MSE audio: '+checks+' checks passed';console.log('MSE AUDIO PASS checks='+checks);
}catch(error){failure(error)}};
</script>
