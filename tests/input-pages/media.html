<!doctype html><meta charset="utf-8"><title>WebM playback</title>
<style>body{font:18px sans-serif;background:#10202b;color:#dcefff;padding:24px}video{width:320px;height:240px;background:#222}button{position:absolute;left:380px;top:180px;padding:16px;margin:10px}pre{white-space:pre-wrap}</style>
<h1>WebM playback</h1><video id="video" muted playsinline preload="auto" src="/media-vp8.webm"></video><br>
<button id="run">Run playback checks</button><pre id="results"></pre>
<script>
const video=document.querySelector('#video'),results=document.querySelector('#results');let checks=0;
const wait=milliseconds=>new Promise(resolve=>setTimeout(resolve,milliseconds));
function check(condition,name){if(!condition)throw Error(name);++checks;results.textContent+=name+'\n';console.log('MEDIA CHECK '+name)}
function event(name,action){return new Promise((resolve,reject)=>{const timer=setTimeout(()=>{cleanup();reject(Error('timeout '+name))},12000);function cleanup(){clearTimeout(timer);video.removeEventListener(name,success);video.removeEventListener('error',failure)}function success(){cleanup();resolve()}function failure(){cleanup();reject(Error('media '+video.error?.code+' '+video.error?.message))}video.addEventListener(name,success);video.addEventListener('error',failure);action?.()})}
function color(){const canvas=document.createElement('canvas');canvas.width=160;canvas.height=120;const context=canvas.getContext('2d');context.drawImage(video,0,0,160,120);return [...context.getImageData(80,60,1,1).data]}
function dominant(index){const pixel=color();return pixel[index]>180&&pixel[(index+1)%3]<60&&pixel[(index+2)%3]<60}
video.addEventListener('loadeddata',()=>console.log('MEDIA READY'));
video.addEventListener('error',()=>console.error('MEDIA FAILURE '+video.error?.code+' '+video.error?.message));
document.querySelector('#run').onclick=async()=>{try{
 check(video.readyState>=2,'loaded frame');check(video.videoWidth===160&&video.videoHeight===120,'decoded dimensions');check(Math.abs(video.duration-3)<.15,'duration');check(dominant(0),'initial decoded red pixels');
 await video.play();await wait(450);check(video.currentTime>.2&&!video.paused,'play advances time');video.pause();const paused=video.currentTime;await wait(250);check(Math.abs(video.currentTime-paused)<.04,'pause freezes time');
 await event('seeked',()=>video.currentTime=1.3);check(dominant(1),'seek displays green frame');console.log('MEDIA GREEN');await wait(1800);
 await event('seeked',()=>video.currentTime=2.3);check(dominant(2),'seek displays blue frame');console.log('MEDIA BLUE');await wait(1800);
 await event('seeked',()=>video.currentTime=.1);video.playbackRate=2;await video.play();await wait(250);video.pause();check(video.currentTime>.4,'playback rate changes clock');
 await event('seeked',()=>video.currentTime=2.8);await event('ended',()=>video.play());check(video.ended,'ended event');
 await event('loadeddata',()=>{video.src='/media-vp9.webm';video.load()});check(dominant(0),'VP9 first frame');
 await event('seeked',()=>video.currentTime=1.4);check(dominant(1),'VP9 seek');
 await video.play();await wait(400);check(video.currentTime>1.6,'VP9 playback');video.pause();
 check(video.getVideoPlaybackQuality().totalVideoFrames>=30,'decoded frame statistics');
 const metadata=await new Promise((resolve,reject)=>{const timer=setTimeout(()=>reject(Error('frame callback timeout')),5000);video.requestVideoFrameCallback((time,frame)=>{clearTimeout(timer);resolve(frame)});video.play()});video.pause();check(metadata.width===160&&metadata.height===120&&metadata.presentedFrames>0,'video frame callback metadata');
 video.loop=true;await event('seeked',()=>video.currentTime=2.8);await video.play();await wait(500);video.pause();check(video.currentTime<1.5&&!video.ended,'loop restarts playback');video.loop=false;
 const child=document.createElement('iframe');child.style.display='none';
 await new Promise((resolve,reject)=>{const timer=setTimeout(()=>reject(Error('child load timeout')),12000);child.onload=()=>{clearTimeout(timer);resolve()};child.srcdoc='<video id="child" muted preload="auto" src="/media-vp8.webm"></video>';document.body.append(child)});
 const childVideo=child.contentDocument.querySelector('video');
 async function childEvent(name,action){await new Promise((resolve,reject)=>{const timer=setTimeout(()=>reject(Error('child '+name+' timeout')),12000);childVideo.addEventListener(name,()=>{clearTimeout(timer);resolve()},{once:true});childVideo.addEventListener('error',()=>{clearTimeout(timer);reject(Error('child media error'))},{once:true});action?.()})}
 if(childVideo.readyState<2)await childEvent('loadeddata');check(childVideo.videoWidth===160&&childVideo.duration===3,'iframe video decode');
 await childEvent('seeked',()=>childVideo.currentTime=1.4);const canvas=document.createElement('canvas');canvas.width=160;canvas.height=120;const context=canvas.getContext('2d');context.drawImage(childVideo,0,0);const pixel=context.getImageData(80,60,1,1).data;check(pixel[1]>180&&pixel[0]<60&&pixel[2]<60,'iframe seek pixels');
 await childVideo.play();await wait(400);check(childVideo.currentTime>1.6,'iframe playback');child.remove();
 await event('loadeddata',()=>video.load());check(dominant(0)&&video.currentTime===0,'reload resets frames and clock');
 document.querySelector('h1').textContent='WebM: '+checks+' checks passed';console.log('MEDIA PASS checks='+checks);
}catch(error){console.error('MEDIA FAILURE '+error.stack);results.textContent+='FAIL '+error.stack}};
</script>
