<!doctype html><meta charset="utf-8"><title>WebGL execution</title>
<style>body{background:#10212c;color:#d7ebfa;font:22px sans-serif;padding:24px}canvas{width:256px;height:256px;image-rendering:pixelated}</style>
<h1 id="status">WebGL running</h1><canvas id="output" width="64" height="64"></canvas><pre id="results"></pre>
<script>
try {
  let checks=0;
  function check(value,label){if(!value)throw Error(label);checks++;results.textContent+=label+'\n';console.log('WEBGL CHECK '+label);}
  const gl=output.getContext('webgl',{antialias:false,preserveDrawingBuffer:true});
  check(!!gl,'ANGLE WebGL context');
  gl.clearColor(0,1,0,1);gl.clear(gl.COLOR_BUFFER_BIT);
  const before=new Uint8Array(4);gl.readPixels(0,0,1,1,gl.RGBA,gl.UNSIGNED_BYTE,before);
  check(before.join(',')==='0,255,0,255','clear and readback');
  function shader(type,source){const shader=gl.createShader(type);gl.shaderSource(shader,source);gl.compileShader(shader);if(!gl.getShaderParameter(shader,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(shader));return shader;}
  const vertex=shader(gl.VERTEX_SHADER,'attribute vec2 position;void main(){gl_Position=vec4(position,0.,1.);}');
  const fragment=shader(gl.FRAGMENT_SHADER,'precision mediump float;void main(){gl_FragColor=vec4(1.,0.,0.,1.);}');
  const program=gl.createProgram();gl.attachShader(program,vertex);gl.attachShader(program,fragment);gl.linkProgram(program);
  check(gl.getProgramParameter(program,gl.LINK_STATUS),'GLSL compile and link');
  gl.useProgram(program);const buffer=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buffer);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-.8,-.8,.8,-.8,0,.8]),gl.STATIC_DRAW);
  const location=gl.getAttribLocation(program,'position');gl.enableVertexAttribArray(location);gl.vertexAttribPointer(location,2,gl.FLOAT,false,0,0);gl.drawArrays(gl.TRIANGLES,0,3);
  const center=new Uint8Array(4);gl.readPixels(32,32,1,1,gl.RGBA,gl.UNSIGNED_BYTE,center);
  check(center.join(',')==='255,0,0,255','triangle rasterization');
  check(gl.getError()===gl.NO_ERROR,'no rendering errors');
  gl.drawArrays(0xffffffff,0,3);check(gl.getError()===gl.INVALID_ENUM,'invalid command validation');
  gl.deleteBuffer(buffer);gl.deleteProgram(program);gl.deleteShader(vertex);gl.deleteShader(fragment);
  document.getElementById('status').textContent='WebGL passed';console.log('WEBGL PASS checks='+checks);
}catch(error){document.getElementById('status').textContent='WebGL failed';results.textContent+=error.stack;console.log('WEBGL FAILURE '+error.stack);}
</script>
