<!doctype html><meta charset="utf-8"><title>Asynchronous input contracts</title>
<style>
body{margin:0;height:14000px;background:linear-gradient(#e5edff,#164488);font:20px sans-serif}
.controls{position:fixed;left:20px;top:20px;z-index:10;background:white;padding:8px}button{height:40px;width:125px}
.sticky{position:sticky;top:0;height:50px;background:#8844cc;color:white;z-index:2}
#blocked{position:fixed;left:30px;top:180px;width:300px;height:180px;background:#dd8899;z-index:4}
#nested{position:fixed;left:700px;top:200px;width:450px;height:300px;overflow:auto;background:white;z-index:3}
.content{height:10000px;background:linear-gradient(#ddffdd,#224422)}
.nested-sticky{position:sticky;top:0;height:40px;background:#22aa66;z-index:1}
#editor{position:fixed;left:30px;top:400px;width:280px;z-index:5}
</style>
<div class="controls"><button id="root">Root keys</button><button id="inside">Nested keys</button><button id="cancel">Cancel keys</button><button id="edit">Text input</button><button id="selectmode">Select input</button></div>
<div style="height:100px"></div><div class="sticky">Root sticky header</div><div id="blocked">Cancelable wheel region</div>
<div id="nested" tabindex="0"><div class="content"><div class="nested-sticky">Nested sticky header</div></div></div>
<input id="editor" value="unchanged"><select id="choices" size="3" style="position:fixed;left:30px;top:470px;width:280px;z-index:5"><option>A</option><option>B</option><option>C</option></select>
<script>
console.log('INPUT ready');
document.body.tabIndex=-1;
addEventListener('wheel',event=>console.log('INPUT passive cancelable='+event.cancelable),{passive:true});
blocked.addEventListener('wheel',event=>{event.preventDefault();console.log('INPUT wheel canceled='+event.defaultPrevented)},{passive:false});
function cancelKey(event){event.preventDefault();console.log('INPUT key canceled='+event.defaultPrevented)}
for(const mode of ['root','inside','cancel','edit','selectmode']) document.getElementById(mode).onclick=()=>{
 removeEventListener('keydown',cancelKey);scrollTo(0,0);nested.scrollTop=0;
 if(mode==='selectmode') choices.focus({preventScroll:true});else if(mode==='inside') nested.focus({preventScroll:true});else if(mode==='edit') editor.focus({preventScroll:true});else document.body.focus({preventScroll:true});
 if(mode==='cancel') addEventListener('keydown',cancelKey);
 setTimeout(()=>{console.log('INPUT '+mode+' begin');const end=performance.now()+12000;
 while(performance.now()<end){}console.log('INPUT '+mode+' end')},1200);
};
addEventListener('scroll',()=>console.log('INPUT root position='+scrollY));
nested.addEventListener('scroll',()=>console.log('INPUT nested position='+nested.scrollTop));
editor.addEventListener('input',()=>console.log('INPUT editor='+editor.value));
choices.addEventListener('change',()=>console.log('INPUT choice='+choices.value));
</script>
