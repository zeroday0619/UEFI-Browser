<!doctype html><meta charset="utf-8"><script>
(async()=>{
 const request=operation=>new Promise((resolve,reject)=>{operation.onsuccess=()=>resolve(operation.result);operation.onerror=()=>reject(operation.error)});
 const opening=indexedDB.open('retained',1);opening.onupgradeneeded=()=>opening.result.createObjectStore('counter');const database=await request(opening);
 const value=await request(database.transaction('counter').objectStore('counter').get('boot'));database.close();
 parent.postMessage({type:'idb-isolation',empty:value===undefined},'https://10.0.2.2:8767');
})().catch(error=>parent.postMessage({type:'idb-isolation',error:String(error)},'https://10.0.2.2:8767'));
</script>
